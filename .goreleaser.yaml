---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: assetcache-exporter

before:
  hooks:
    - mise run tidy-check

builds:
  - id: assetcache_exporter
    main: ./cmd/assetcache_exporter
    binary: assetcache_exporter
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/prometheus/common/version.Version={{ .Version }}
      - -X github.com/prometheus/common/version.Revision={{ .Commit }}
      - -X github.com/prometheus/common/version.Branch={{ .Branch }}
      - -X github.com/prometheus/common/version.BuildUser=goreleaser
      - -X github.com/prometheus/common/version.BuildDate={{ .Date }}

notarize:
  macos:
    - enabled: "true"
      ids:
        - assetcache_exporter
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.APPSTORE_ISSUER_ID }}"
        key_id: "{{ .Env.APPSTORE_API_KEY_ID }}"
        key: "{{ .Env.APPSTORE_API_PRIVATE_KEY_PATH }}"
        wait: true
        timeout: 20m

archives:
  - ids:
      - assetcache_exporter
    formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  mode: keep-existing

changelog:
  disable: true

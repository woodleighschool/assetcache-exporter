---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: assetcache-exporter

before:
  hooks:
    - mise run tidy-check

builds:
  - id: assetcache-exporter
    main: ./cmd/assetcache_exporter
    binary: assetcache-exporter
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/prometheus/common/version.Version={{ .Version }}
      - -X github.com/prometheus/common/version.Revision={{ .Commit }}
      - -X github.com/prometheus/common/version.Branch={{ .Branch }}
      - -X github.com/prometheus/common/version.BuildUser=goreleaser
      - -X github.com/prometheus/common/version.BuildDate={{ .Date }}

archives:
  - ids:
      - assetcache-exporter
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - packaging/au.edu.vic.woodleigh.assetcache-exporter.plist

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  mode: keep-existing

changelog:
  disable: true

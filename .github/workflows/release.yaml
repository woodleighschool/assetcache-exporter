---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: macOS release
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      APP_SIGNING_IDENTITY: "Developer ID Application: Woodleigh School (SMLKBTR495)"
      PKG_SIGNING_IDENTITY: "Developer ID Installer: Woodleigh School (SMLKBTR495)"
      MISE_NO_HOOKS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
          experimental: true
          install_args: --locked go

      - name: Import Developer ID Application certificate
        id: import-application-cert
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}

      - name: Import Developer ID Installer certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          create-keychain: false
          keychain-password: ${{ steps.import-application-cert.outputs.keychain-password }}
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}

      - name: Build and sign binary
        env:
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          BUILD_DATE="$(git show -s --format=%cI "${GITHUB_SHA}")"

          mkdir -p dist

          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build \
              -trimpath \
              -ldflags "-s -w \
                -X github.com/prometheus/common/version.Version=${VERSION} \
                -X github.com/prometheus/common/version.Revision=${GITHUB_SHA} \
                -X github.com/prometheus/common/version.Branch=${RELEASE_TARGET} \
                -X github.com/prometheus/common/version.BuildUser=github-actions \
                -X github.com/prometheus/common/version.BuildDate=${BUILD_DATE}" \
              -o dist/assetcache_exporter \
              ./cmd/assetcache_exporter

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "${APP_SIGNING_IDENTITY}" \
            dist/assetcache_exporter

          codesign --verify --strict --verbose=2 dist/assetcache_exporter

      - name: Build and sign package
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          PAYLOAD="${RUNNER_TEMP}/payload"
          PKG_PATH="${GITHUB_WORKSPACE}/dist/assetcache-exporter-${VERSION}-darwin-arm64.pkg"

          mkdir -p "${PAYLOAD}/usr/local/bin" "${PAYLOAD}/Library/LaunchDaemons"

          install -m 0755 \
            dist/assetcache_exporter \
            "${PAYLOAD}/usr/local/bin/assetcache_exporter"

          install -m 0644 \
            packaging/au.edu.vic.woodleigh.assetcache-exporter.plist \
            "${PAYLOAD}/Library/LaunchDaemons/au.edu.vic.woodleigh.assetcache-exporter.plist"

          pkgbuild \
            --root "${PAYLOAD}" \
            --scripts packaging/scripts \
            --identifier au.edu.vic.woodleigh.assetcache-exporter \
            --version "${VERSION}" \
            --install-location / \
            --sign "${PKG_SIGNING_IDENTITY}" \
            "${PKG_PATH}"

      - name: Notarize package
        env:
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          PKG_PATH="${GITHUB_WORKSPACE}/dist/assetcache-exporter-${VERSION}-darwin-arm64.pkg"
          NOTARY_KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"

          trap 'rm -f "${NOTARY_KEY_PATH}"' EXIT

          printf '%s' "${APPLE_NOTARY_KEY_P8_BASE64}" | base64 -D > "${NOTARY_KEY_PATH}"
          chmod 600 "${NOTARY_KEY_PATH}"

          xcrun notarytool submit "${PKG_PATH}" \
            --key "${NOTARY_KEY_PATH}" \
            --key-id "${APPLE_NOTARY_KEY_ID}" \
            --issuer "${APPLE_NOTARY_ISSUER_ID}" \
            --wait

          xcrun stapler staple "${PKG_PATH}"
          xcrun stapler validate "${PKG_PATH}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release upload \
            "${RELEASE_TAG}" \
            "dist/assetcache-exporter-${VERSION}-darwin-arm64.pkg" \
            --clobber

---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MISE_NO_HOOKS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
          experimental: true
          install_args: --locked go

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --parallelism=2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload package input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assetcache-exporter-darwin-arm64
          path: dist/assetcache-exporter_darwin_arm64_v8.0/assetcache-exporter
          retention-days: 1

  package:
    name: macOS Package
    needs: goreleaser
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download package input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: assetcache-exporter-darwin-arm64
          path: package-input

      - name: Stage package
        run: |
          mkdir -p payload/usr/local/bin payload/Library/LaunchDaemons
          cp package-input/assetcache-exporter payload/usr/local/bin/assetcache-exporter
          chmod 0755 payload/usr/local/bin/assetcache-exporter
          cp packaging/au.edu.vic.woodleigh.assetcache-exporter.plist payload/Library/LaunchDaemons/

      - name: Build package
        run: |
          pkgbuild \
            --root payload \
            --scripts packaging/scripts \
            --identifier au.edu.vic.woodleigh.assetcache-exporter \
            --version "${GITHUB_REF_NAME#v}" \
            --install-location / \
            "assetcache-exporter_${GITHUB_REF_NAME#v}_darwin_arm64.pkg"

      - name: Add package to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" assetcache-exporter_*_darwin_arm64.pkg --clobber

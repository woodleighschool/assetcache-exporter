---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: macOS release
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      APP_SIGNING_IDENTITY: "Developer ID Application: Woodleigh School (SMLKBTR495)"
      PKG_SIGNING_IDENTITY: "Developer ID Installer: Woodleigh School (SMLKBTR495)"
      MISE_NO_HOOKS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          experimental: true
          install_args: --locked go

      - name: Resolve release version
        id: release
        run: |
          VERSION="${RELEASE_TAG#v}"
          test -n "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --clean --single-target

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Import Developer ID Application certificate
        id: application-certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}

      - name: Prepare package root
        id: payload
        run: |
          set -euo pipefail

          BINARY_PATH="$(find "${GITHUB_WORKSPACE}/dist" -type f -name assetcache_exporter -print -quit)"
          PAYLOAD_ROOT="${RUNNER_TEMP}/package-root"

          test -n "${BINARY_PATH}"

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "${APP_SIGNING_IDENTITY}" \
            "${BINARY_PATH}"

          codesign --verify --strict --verbose=2 "${BINARY_PATH}"

          mkdir -p "${PAYLOAD_ROOT}/usr/local/bin"
          ditto --norsrc packaging/root "${PAYLOAD_ROOT}"
          ditto --norsrc \
            "${BINARY_PATH}" \
            "${PAYLOAD_ROOT}/usr/local/bin/assetcache_exporter"

          echo "root=${PAYLOAD_ROOT}" >> "${GITHUB_OUTPUT}"

      - name: Import Developer ID Installer certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          create-keychain: false
          keychain-password: ${{ steps.application-certificate.outputs.keychain-password }}
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}

      - name: Build package
        id: package
        uses: woodleighschool/.github/actions/apple-pkg@583bc37748899a9154880b1c538b15cf46b5b05d # apple-pkg-v1.0.0
        with:
          payload-root: ${{ steps.payload.outputs.root }}
          identifier: au.edu.vic.woodleigh.assetcache-exporter
          version: ${{ steps.release.outputs.version }}
          signing-identity: ${{ env.PKG_SIGNING_IDENTITY }}
          output: dist/assetcache-exporter-${{ steps.release.outputs.version }}.pkg

      - name: Notarize package
        uses: woodleighschool/.github/actions/apple-notarize@a85ca6bcf210fe5e22e50da1d832f211c2b44605 # apple-notarize-v2.0.0
        with:
          product-path: ${{ steps.package.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Verify package
        env:
          PKG_PATH: ${{ steps.package.outputs.path }}
        run: |
          pkgutil --check-signature "${PKG_PATH}"
          spctl --assess --type install --verbose=2 "${PKG_PATH}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_PATH: ${{ steps.package.outputs.path }}
        run: |
          gh release upload \
            "${RELEASE_TAG}" \
            "${PKG_PATH}" \
            --clobber

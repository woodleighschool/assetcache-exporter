---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: macOS release
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      PKG_SIGNING_IDENTITY: "Developer ID Installer: Woodleigh School (SMLKBTR495)"
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      MISE_NO_HOOKS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
          experimental: true
          install_args: --locked go

      - name: Prepare App Store Connect key
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077

          printf '%s' "${APPSTORE_API_PRIVATE_KEY}" > "${RUNNER_TEMP}/AuthKey.p8"
          echo "APPSTORE_API_PRIVATE_KEY_PATH=${RUNNER_TEMP}/AuthKey.p8" >> "${GITHUB_ENV}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --parallelism=2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}

      - name: Remove App Store Connect key
        if: ${{ always() }}
        run: rm -f "${APPSTORE_API_PRIVATE_KEY_PATH}"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Import Developer ID Installer certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}

      - name: Build and sign package
        id: package
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          BINARY_PATH="$(find "${GITHUB_WORKSPACE}/dist" -type f -name assetcache_exporter -print -quit)"
          PAYLOAD="${RUNNER_TEMP}/payload"
          PKG_PATH="${GITHUB_WORKSPACE}/dist/assetcache-exporter_${VERSION}_darwin_arm64.pkg"

          test -n "${BINARY_PATH}"
          codesign --verify --strict --verbose=2 "${BINARY_PATH}"

          mkdir -p "${PAYLOAD}/usr/local/bin" "${PAYLOAD}/Library/LaunchDaemons"

          install -m 0755 \
            "${BINARY_PATH}" \
            "${PAYLOAD}/usr/local/bin/assetcache_exporter"

          install -m 0644 \
            packaging/au.edu.vic.woodleigh.assetcache-exporter.plist \
            "${PAYLOAD}/Library/LaunchDaemons/au.edu.vic.woodleigh.assetcache-exporter.plist"

          pkgbuild \
            --root "${PAYLOAD}" \
            --scripts packaging/scripts \
            --identifier au.edu.vic.woodleigh.assetcache-exporter \
            --version "${VERSION}" \
            --install-location / \
            --sign "${PKG_SIGNING_IDENTITY}" \
            "${PKG_PATH}"

          echo "path=${PKG_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Notarize package
        uses: woodleighschool/.github/actions/apple-notarize@a85ca6bcf210fe5e22e50da1d832f211c2b44605 # apple-notarize-v2.0.0
        with:
          product-path: ${{ steps.package.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Verify package
        run: |
          VERSION="${RELEASE_TAG#v}"
          PKG_PATH="${GITHUB_WORKSPACE}/dist/assetcache-exporter_${VERSION}_darwin_arm64.pkg"

          pkgutil --check-signature "${PKG_PATH}"
          spctl --assess --type install --verbose=2 "${PKG_PATH}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release upload \
            "${RELEASE_TAG}" \
            "dist/assetcache-exporter_${VERSION}_darwin_arm64.pkg" \
            --clobber
